<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08080A; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; cursor: grab; }

    /* HUD */
    #hud-top-left {
      position: absolute; top: 12px; left: 16px; z-index: 10;
    }
    .workspace-active #hud-top-left { top: 60px; }

    #hud-title {
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.2);
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    #hud-project {
      font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; display: none;
    }
    #hud-breadcrumb {
      display: none; margin-top: 6px; font-size: 12px;
    }
    .crumb {
      color: rgba(255,255,255,0.5); cursor: pointer; padding: 2px 6px;
      border-radius: 3px; transition: all 0.15s;
    }
    .crumb:hover { color: rgba(255,255,255,0.95); background: rgba(255,255,255,0.08); }
    .sep { color: rgba(255,255,255,0.15); margin: 0 2px; }

    #hud-top-right {
      position: absolute; top: 12px; right: 16px; z-index: 10;
    }
    .workspace-active #hud-top-right { display: none; }

    #hud-top-right {
      display: flex; gap: 8px; align-items: center;
    }
    #hud-lock, #hud-layout {
      font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      transition: all 0.15s;
    }
    #hud-lock:hover, #hud-layout:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }

    #hud-bottom-left {
      position: absolute; bottom: 12px; left: 16px; z-index: 10;
    }
    #hud-hint {
      font-size: 10px; color: rgba(255,255,255,0.2);
      font-family: system-ui, sans-serif; line-height: 1.6;
    }

    /* Workspace Toolbar */
    #workspace-toolbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      height: 48px;
      background: rgba(12,12,16,0.92);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      align-items: center; padding: 0 16px; gap: 8px;
      display: none;
    }
    #workspace-toolbar.active { display: flex; }

    #workspace-toolbar .tb-project-name {
      font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.8);
      margin-right: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 240px;
    }
    #workspace-toolbar .tb-project-color {
      width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
    }
    #workspace-toolbar .tb-count {
      font-size: 11px; color: rgba(255,255,255,0.3); margin-right: 8px;
    }
    #workspace-toolbar .tb-divider {
      width: 1px; height: 24px; background: rgba(255,255,255,0.08); margin: 0 6px;
    }
    .tb-btn {
      font-size: 11px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5); transition: all 0.15s; white-space: nowrap;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }

    #workspace-toolbar .tb-spacer { flex: 1; }
    #workspace-toolbar .tb-hint {
      font-size: 10px; color: rgba(255,255,255,0.2); margin-right: 8px;
    }

    /* Settings Panel */
    #settings-panel {
      display: none; position: absolute; top: 50px; right: 16px; z-index: 20;
      background: rgba(20,20,24,0.95); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 16px; width: 260px;
      backdrop-filter: blur(12px);
    }
    .settings-title {
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
    }
    #settings-panel label {
      display: block; font-size: 11px; color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
    }
    #settings-panel input[type="number"] {
      width: 60px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; padding: 3px 6px; color: #fff; font-size: 11px;
      margin-left: 6px;
    }
    #settings-panel input[type="checkbox"] {
      margin-right: 6px;
    }
    #settings-panel button {
      font-size: 11px; padding: 5px 14px; border-radius: 4px; cursor: pointer;
      margin-right: 6px; margin-top: 8px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7); transition: all 0.15s;
    }
    #settings-panel button:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Workspace Toolbar (shown in project view) -->
  <div id="workspace-toolbar">
    <div class="tb-project-color" id="tb-color"></div>
    <div class="tb-project-name" id="tb-name">Project</div>
    <div class="tb-count" id="tb-count"></div>
    <div class="tb-divider"></div>
    <button class="tb-btn" id="tb-open" title="Open file in OS app">Open</button>
    <button class="tb-btn" id="tb-reset-layout" title="Reset to auto-layout">Auto-arrange</button>
    <div class="tb-spacer"></div>
    <span class="tb-hint">drag = move · dbl-click = open · Esc = back</span>
    <button class="tb-btn" id="tb-exit" title="Back to galaxy">← Galaxy</button>
  </div>

  <!-- HUD: Top Left -->
  <div id="hud-top-left">
    <div id="hud-title">Portal</div>
    <div id="hud-project"></div>
    <div id="hud-breadcrumb"></div>
  </div>

  <!-- HUD: Top Right -->
  <div id="hud-top-right">
    <div id="hud-layout">◎ Orbit</div>
    <div id="hud-lock">🔒</div>
  </div>

  <!-- HUD: Bottom Left -->
  <div id="hud-bottom-left">
    <div id="hud-hint">scroll = zoom · drag = pan · dbl-click = enter · Ctrl+S = settings</div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
